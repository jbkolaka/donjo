# donjo_notifications: its own Podman deployment. Consumes from the shared
# RabbitMQ (infra) on the external `donjo-net` network and keeps its SQLite
# feed in a named volume.
services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    container_name: donjo_notifications
    image: localhost/donjo_notifications:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8086}:${PORT:-8086}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${PORT:-8086}
      BLUEPRINT_DB_URL: ${BLUEPRINT_DB_URL:-./db/donjo_notifications.db}
      JWT_SECRET: ${JWT_SECRET:-35676ba264d618c86f8e950ecc33bb65658f423f01117ab63f3700d5bb9e6b35}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-donjo-internal-service-token}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - sqlite_bp:/app/db
    networks:
      - donjo-net

volumes:
  sqlite_bp:

networks:
  donjo-net:
    external: true
